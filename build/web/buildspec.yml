version: 0.2

# Builds the first-party frontend (build/web) and publishes the error
# pages, then invalidates the primary CloudFront distribution. The build logic lives in
# build/web/publish.sh beside this file; the CodeBuild project injects every
# input from the module variables (SITE_TITLE, ERRORS_BUCKET_NAME,
# DISTRIBUTION_ID) so the script needs no terraform.
#
# The command below is relative to the CodeBuild source root, not to this
# file. This project runs npm ci + npm run build itself --
# lint/typecheck/test are CI's job (.github/workflows/ci.yml's `web` job),
# gating the PR before this project would ever be asked to publish it.

phases:
  install:
    runtime-versions:
      nodejs: 22
  build:
    commands:
      - sh build/web/publish.sh

# npm's content-addressed tarball cache, backed by the project's S3 cache
# bucket -- see modules/web-build/main.tf's cache bucket.
cache:
  paths:
    - /root/.npm/**/*
