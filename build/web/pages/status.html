<!doctype html>
<!--
  No default data-theme, unlike pages/errors/shell.html -- main.tsx only
  ever sets this attribute for an *explicit* dark/light choice (matching
  status.html's own theme-sync script), leaving "system" for status.css's
  @media(prefers-color-scheme) rule to resolve on its own. A "light"
  default here would incorrectly win for a system-dark visitor, since main
  never touches the attribute in that case.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- With public_reliability on, this page is a real anonymous URL
         someone could link to -- keep it out of search results the way
         the static error pages already do. -->
    <meta name="robots" content="noindex" />
    <!-- Empty data: URI, not an omission: without an explicit favicon the
         browser falls back to GET /favicon.ico against the app origin on
         every load (a guaranteed 404 there is not a route this build or
         the app serves). -->
    <link rel="icon" href="data:," />
    <title>Status</title>
    <!-- Per-deployment config, written by terraform/modules/edge's
         aws_s3_object.status_config from tfvars. Must load before the bundle below
         (plain script tags execute in order) so main.tsx's window.gwConfig
         read at module top level sees it. Absolute path: this page is also
         reachable at /_status (no trailing slash), where a relative src
         would resolve outside the /_status prefix. -->
    <script src="/_status/config.js"></script>
    <!--
      Theme application must run before the stylesheet below is parsed, or
      a dark-preference visitor on the default light attribute sees a
      flash -- see src/status/main.tsx's header comment. That ordering
      requirement is why this script tag precedes the stylesheet link, and
      why gwFinalize (vite/finalize.ts) downgrades its inlined, otherwise-
      deferred type="module" tag to a plain blocking script at build time.
    -->
    <script type="module" src="/src/status/main.tsx"></script>
    <link rel="stylesheet" href="/src/status/status.css" />
  </head>
  <body>
    <header>
      <h1>Status</h1>
      <p id="who"></p>
    </header>

    <!-- Static skeleton, sized to the content each block will be replaced
         by, so the swap causes no reflow -- and so a script that throws
         before mounting still shows a page (see status-skeleton.spec.ts).
         Sibling of #panels, not a parent/child of it: Preact's render()
         corrupts a container that already holds foreign DOM, so App.tsx
         removes this element outright via a plain DOM call the moment it
         has something to show, rather than rendering into it. -->
    <div id="skeleton">
      <h2 class="section-head">Service</h2>
      <div class="card">
        <h3>Reliability</h3>
        <div class="sk sk-stats"></div>
        <div class="sk sk-strip"></div>
        <div class="sk sk-chart"></div>
      </div>
      <div class="card">
        <h3>Incidents (1y)</h3>
        <div class="sk sk-stats"></div>
        <div class="sk sk-rows"></div>
      </div>

      <h2 class="section-head">Delivery</h2>
      <div class="card">
        <h3>Deployment</h3>
        <div class="subgrid">
          <div class="sk sk-rows"></div>
          <div class="sk sk-rows"></div>
          <div class="sk sk-rows"></div>
        </div>
      </div>

      <h2 class="section-head" data-panel="backups">Data</h2>
      <div class="card" data-panel="backups">
        <h3>Backups</h3>
        <div class="subgrid">
          <div class="sk sk-rows"></div>
          <div class="sk sk-rows"></div>
        </div>
      </div>

      <h2 class="section-head">Runtime</h2>
      <div class="card">
        <h3>Host</h3>
        <div class="subgrid">
          <div class="sk sk-rows"></div>
          <div class="sk sk-chart" data-panel="host_metrics"></div>
        </div>
      </div>
      <div class="card">
        <h3>Storage</h3>
        <div class="subgrid">
          <div class="sk sk-rows"></div>
          <div class="sk sk-rows"></div>
        </div>
      </div>
      <div class="card" data-panel="assistant">
        <h3>Assistant</h3>
        <div class="subgrid">
          <div class="sk sk-rows"></div>
          <div>
            <div class="sk sk-chart"></div>
            <div class="sk sk-stats"></div>
          </div>
        </div>
      </div>

      <h2 class="section-head" data-panel="cost">Spend</h2>
      <div class="card" data-panel="cost">
        <h3>Cost (month to date)</h3>
        <div class="sk sk-stats"></div>
        <div class="sk sk-strip"></div>
      </div>
    </div>

    <!-- Preact mount root; starts empty. -->
    <div id="panels"></div>
    <div id="gate" class="hidden"></div>
  </body>
</html>
