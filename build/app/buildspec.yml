version: 0.2

# Builds the Gramps Web image (upstream release + addons) and pushes a
# multi-arch index to ECR, then emits the CodeDeploy bundle (bundle/, with a
# freshly written gramps.env pinning the pushed digest) as the pipeline
# artifact. All logic lives in build/app/build.sh beside this file; the
# CodeBuild project injects ECR_REPO_URL and GRAMPS_WEB_VERSION. Requires
# privileged mode (docker buildx): the managed image pinned by codebuild_image
# in locals.tf auto-starts dockerd under privileged mode
# and ships git + the AWS CLI + buildx.
#
# Paths below are relative to the CodeBuild source root, not to this file.
# base-directory is what makes build/app/bundle the CodeDeploy bundle root, so
# appspec.yml's hook locations resolve against it.

phases:
  install:
    # For the optional frontend override (gramps_web_repo in tfvars): pin the
    # node the fork's dist is built with to what upstream's release workflow
    # uses. Selecting a preinstalled runtime is cheap, so it is unconditional.
    runtime-versions:
      nodejs: 22
  build:
    commands:
      - sh build/app/build.sh

artifacts:
  base-directory: build/app/bundle
  files:
    - "**/*"
