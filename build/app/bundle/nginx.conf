# TLS-terminating reverse proxy for grampsweb. Reloaded by scripts/origin_cert.sh
# when ACM renews the certificate.

# origin-secret.map is rendered at deploy time by scripts/after_install.sh:
# `"<secret>" 1;` and `default 0;`, or just `default 1;` when the instance does
# not know the secret yet (an instance booted before the origin secret existed).
map $http_x_origin_verify $origin_secret_ok {
    include /etc/nginx/origin-secret.map;
}

# Only the public listener (443) checks the secret. The plain listener on 8080
# is published on the host's loopback alone (docker-compose.yml) for the
# on-instance health checks, which cannot send it.
map "$server_port:$origin_secret_ok" $origin_denied {
    "443:0" 1;
    default 0;
}

server {
    listen 443 ssl;
    listen 8080;
    http2 on;

    ssl_certificate     /etc/gramps/tls/fullchain.pem;
    ssl_certificate_key /etc/gramps/tls/privkey.pem;

    client_max_body_size 0;

    if ($origin_denied) {
        return 403;
    }

    # Docker's resolver plus a variable make nginx look grampsweb up per
    # request; a fixed address goes stale when `compose up` recreates it.
    resolver 127.0.0.11 valid=5s;
    set $app http://grampsweb:5000;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app never needs the secret.
        proxy_set_header X-Origin-Verify "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
