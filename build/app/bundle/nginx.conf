# TLS-terminating reverse proxy for grampsweb. Reloaded by scripts/origin_cert.sh
# when ACM renews the certificate.

# The origin secret policy, rendered at deploy time by scripts/after_install.sh:
# origin-secret.map lists every accepted X-Origin-Verify value (`"<value>" 1;`,
# then `default 0;`); origin-enforce.map is `default 1;` to answer 403 to the
# rest, or `default 0;` to only log them. Edited in place and picked up by
# `nginx -s reload` (scripts/application_start.sh).
map $http_x_origin_verify $origin_secret_ok {
    include /etc/nginx/origin-secret.map;
}

map $server_port $origin_enforce {
    include /etc/nginx/origin-enforce.map;
}

# Only the public listener (443) checks the secret. The plain listener on 8080
# is published on the host's loopback alone (docker-compose.yml) for the
# on-instance health checks, which cannot send it.
map "$server_port:$origin_secret_ok:$origin_enforce" $origin_denied {
    "443:0:1" 1;
    default 0;
}

map $server_port $origin_public {
    443 1;
    default 0;
}

# One line per public request, so a log-only rollout can confirm that
# CloudFront's header arrives (README, "Origin secret").
log_format origin_check '$time_iso8601 origin_secret=$origin_secret_ok enforce=$origin_enforce $status "$request_uri"';

server {
    listen 443 ssl;
    listen 8080;
    http2 on;

    ssl_certificate     /etc/gramps/tls/fullchain.pem;
    ssl_certificate_key /etc/gramps/tls/privkey.pem;

    client_max_body_size 0;

    access_log /dev/stdout origin_check if=$origin_public;

    if ($origin_denied) {
        return 403;
    }

    # Docker's resolver plus a variable make nginx look grampsweb up per
    # request; a fixed address goes stale when `compose up` recreates it.
    resolver 127.0.0.11 valid=5s;
    set $app http://grampsweb:5000;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app never needs the secret.
        proxy_set_header X-Origin-Verify "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
