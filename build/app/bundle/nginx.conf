# TLS-terminating reverse proxy for grampsweb. Reloaded by scripts/origin_cert.sh
# when ACM renews the certificate.

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/gramps/tls/fullchain.pem;
    ssl_certificate_key /etc/gramps/tls/privkey.pem;

    client_max_body_size 0;

    # Docker's resolver plus a variable make nginx look grampsweb up per
    # request; a fixed address goes stale when `compose up` recreates it.
    resolver 127.0.0.11 valid=5s;
    set $app http://grampsweb:5000;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
