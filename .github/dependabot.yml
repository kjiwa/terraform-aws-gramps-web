version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The examples' lock files only, not the modules' versions.tf floors: those
  # are deliberately broad (">= 6.45") and pinned exactly only by a consumer's
  # lock file.
  - package-ecosystem: terraform
    directories:
      - /examples/*
    schedule:
      interval: weekly
    groups:
      providers:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /build/web
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    # typescript-eslint peers typescript ">=4.8.4 <6.1.0"; a TS major breaks
    # `npm ci` for every package in the group, not just typescript.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly

  # skip-ecosystem: docker -- Dockerfile FROM is fully parameterized; the
  # version lives in the module variables, upgraded by a deliberate procedure.
