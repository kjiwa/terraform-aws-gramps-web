name: ci

# Terraform config scanning (trivy) on PRs and pushes to the default branch;
# secret scanning (gitleaks) runs in privacy.yml. Runs on every change; the path-filtered suites
# live in terraform.yml, web.yml and python.yml. Accepted trivy findings for
# this stack's cost/architecture trade-offs live in .trivyignore.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Workaround for GitHub's Node 20 -> 24 runtime migration for JavaScript
  # actions until CI stops emitting Node 20 deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '1'
          # format: sarif otherwise makes the action unset TRIVY_SEVERITY
          # entirely before invoking trivy (see its entrypoint.sh's SARIF
          # handling), so exit-code would gate on every severity, not just
          # HIGH/CRITICAL as configured above and triaged in .trivyignore.
          limit-severities-for-sarif: 'true'
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-sarif
          path: trivy.sarif
